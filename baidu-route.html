<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
<title>骑行路线测试</title>
<style>
  * { margin: 0; padding: 0; }
  #map { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://webapi.amap.com/maps?v=1.4.15&key=45cbf43f4675e9b9377fa955a6b1e996"></script>
<script>
// 先创建地图
var map = new AMap.Map('map', {
  center: [120.15, 30.28],
  zoom: 12
});

// 只画一条简单的线：从家到杨公堤的直线
var path = [
  [120.164353, 30.337044],
  [120.15, 30.28],
  [120.132720, 30.239869]
];

var poly = new AMap.Polyline({
  path: path,
  strokeColor: '#e74c3c',
  strokeWeight: 5,
  strokeOpacity: 0.9,
});
poly.setMap(map);

// 加个标记
new AMap.Marker({position: [120.164353, 30.337044]}).setMap(map);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房企考察·华润×建发×中海×保利</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--white:#faf9f7;--bd:#e8e4df;--text:#2c2c2c;--muted:#8a8681;--accent:#1a5276;--gold:#b8860b}
body{font-family:'Noto Sans SC','PingFang SC',system-ui,sans-serif;background:var(--white);color:var(--text);display:grid;grid-template-columns:148px 1fr;height:100vh;overflow:hidden}
#timeline{width:148px;overflow-y:auto;padding:16px 0;background:var(--white);border-right:1px solid var(--bd)}
.tl-item{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .2s}
.tl-item:hover{background:#f0ede8}
.tl-item.active{border-left-color:var(--accent);background:#f5f0ea}
.tl-item .tl-date{font-size:11px;color:var(--muted);letter-spacing:.5px}
.tl-item .tl-name{font-size:13px;font-weight:600;margin-top:2px}
.tl-item .tl-brief{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-item .tl-time{font-size:10px;color:var(--accent);margin-top:2px}
.tl-divider{height:20px;position:relative}
.tl-divider::after{content:'';position:absolute;left:18px;top:0;bottom:0;width:1px;background:var(--bd)}
#map-wrap{position:relative;overflow:hidden}
#map{height:100vh;width:100%}
.iw{max-width:320px;font-family:'Noto Sans SC',system-ui,sans-serif}
.iw-head{border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px}
.iw-date{font-size:11px;color:var(--muted)}
.iw-title{font-size:18px;font-weight:700;margin-top:2px}
.iw-brief{font-size:13px;line-height:1.6;margin:8px 0;color:#444}
.iw-feature{font-size:12px;margin:6px 0;padding-left:14px;position:relative}
.iw-feature::before{content:'·';position:absolute;left:4px;color:var(--accent)}
.iw-spots{margin-top:10px}
.spot{padding:6px 10px;margin:4px 0;border-radius:6px;font-size:12px}
.spot-design{background:#e8f0f8}
.spot-tip{background:#f0f5e8}
.spot-name{font-weight:600}
.spot-desc{color:#555;margin-top:2px}
.iw-history{margin-top:8px;padding:8px 10px;background:#faf5ee;border-radius:6px;font-size:12px;line-height:1.6;color:#555}
#rb-btn{position:fixed;top:16px;right:16px;z-index:200}
.rb-trigger{background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.rb-trigger:hover{background:#0e3a55}
#rb-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none}
#rb-panel{position:fixed;top:0;left:0;bottom:0;width:380px;max-width:90vw;background:var(--white);z-index:400;transform:translateX(-100%);transition:transform .35s cubic-bezier(.32,0,.15,1);overflow-y:auto}
#rb-panel.open{transform:translateX(0)}
#rb-overlay.show{display:block}
#rb-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}
#rb-header span{font-size:16px;font-weight:700}
#rb-close{background:none;border:none;font-size:20px;cursor:pointer;padding:4px}
#rb-body{padding:16px 20px}
.rb-day{margin-bottom:24px}
.rb-day-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rb-day-date{font-size:13px;font-weight:700;color:var(--accent)}
.rb-day-city{font-size:14px;font-weight:600}
.rb-day-km{font-size:11px;color:var(--muted)}
.rb-entries{margin-top:8px}
.rb-entry{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #f0ede8}
.rb-time{font-size:11px;color:var(--muted);font-weight:600}
.rb-action{font-size:13px}
.rb-note{font-size:11px;color:var(--muted);margin-top:1px}
.rb-entry.drive .rb-action{color:var(--accent)}
.rb-entry.key .rb-action{font-weight:600}
@media(max-width:767px){
body{grid-template-columns:1fr}
#timeline{position:fixed;left:0;right:0;bottom:0;width:100%;height:85vh;border-radius:18px 18px 0 0;transform:translateY(calc(85vh - 72px));transition:transform .38s cubic-bezier(.32,0,.15,1);z-index:500;overflow-y:auto;background:var(--white)}
#timeline[data-state="half"]{transform:translateY(calc(85vh - 40vh))}
#timeline[data-state="full"]{transform:translateY(0)}
.amap-info-outer{display:none!important}
#rb-panel{width:100vw;max-width:100vw}
}
</style>
</head>
<body>
<div id="timeline" data-state="closed">
<div class="tl-item active" data-i="0"><div class="tl-date">08:30</div><div class="tl-name">晶悦府→栖湖云庄</div><div class="tl-brief">出发·约35min</div><div class="tl-time">🚗 往西</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="1"><div class="tl-date">09:10–10:30</div><div class="tl-name">建发·栖湖云庄</div><div class="tl-brief">蒋村·杭州地王</div><div class="tl-time">🏗️ 建发</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="2"><div class="tl-date">10:30–10:50</div><div class="tl-name">栖湖云庄→杭珹未来中心</div><div class="tl-brief">驾车约15min</div><div class="tl-time">🚗 未来科技城</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="3"><div class="tl-date">10:50–12:30</div><div class="tl-name">华润·杭珹未来中心</div><div class="tl-brief">未来科技城·TOD</div><div class="tl-time">🏗️ 华润</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="4"><div class="tl-date">12:30–13:30</div><div class="tl-name">午餐</div><div class="tl-brief">杭珹周边用餐</div><div class="tl-time">🍽️</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="5"><div class="tl-date">13:30–14:00</div><div class="tl-name">杭珹→奥体</div><div class="tl-brief">驾车约25min</div><div class="tl-time">🚗 往东过江</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="6"><div class="tl-date">14:00–15:30</div><div class="tl-name">中海玖序+保利天珺</div><div class="tl-brief">奥体·两盘紧邻</div><div class="tl-time">🏗️ 中海·保利</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="7"><div class="tl-date">15:30–16:00</div><div class="tl-name">奥体→晶悦府</div><div class="tl-brief">驾车约25min</div><div class="tl-time">🏠 回家</div></div>
</div>
<div id="map-wrap">
<div id="map"></div>
<div id="rb-btn"><div class="rb-trigger" id="rb-open">📋 考察路书</div></div>
<div id="rb-overlay"></div>
<div id="rb-panel"><div id="rb-header"><span>📋 房企考察路书</span><button id="rb-close">✕</button></div><div id="rb-body"></div></div>
</div>

<script>
const AMAP_KEY='45cbf43f4675e9b9377fa955a6b1e996',AMAP_SECRET='830b90a26c3b039ba69daccced906ba1';
window._AMapSecurityConfig={securityJsCode:AMAP_SECRET};

const stops=[
{d:"08:30",name:"晶悦府",lat:30.3370,lng:120.1644,type:"start",title:"出发",brief:"拱墅铁路北→蒋村·西溪",places:[],features:["出门走留石快速路西行","导航至建发栖湖云庄"]},
{d:"09:10",name:"建发·栖湖云庄",lat:30.285581,lng:120.074507,type:"star",title:"建发·蒋村地王 | 西溪湿地旁低密排屋",brief:"102轮竞价·楼面价88029元/㎡创杭州纪录·83套4层纯排屋·户均476㎡",
places:[{name:"西溪湿地",desc:"直线距离约300米"},{name:"蒋村板块",desc:"近十年唯一低密宅地"}],
features:["容积率1.1纯低密","总价3000万+顶豪","建发最高端产品线"],
spots:[{tag:"design",name:"考察重点",desc:"新中式排屋立面、园区景观打造"},{tag:"design",name:"设计单位",desc:"GWTD/GAD等设计"},{tag:"tip",name:"关注",desc:"低密产品的空间尺度和精装标准"}],
history:"建发房产经102轮竞价以34.35亿夺得蒋村地块，溢价率115.39%，楼面价88029元/㎡刷新杭州纪录。项目紧邻西溪湿地，容积率仅1.1，规划83套4层纯排屋，户均面积约476㎡，是杭州顶豪市场的标志性项目。"},
{d:"10:30",name:"华润·杭珹未来中心",lat:30.259402,lng:119.993425,type:"star",title:"华润置地·未来科技城TOD | 超100万㎡城市综合体",brief:"绿汀路三地铁上盖，约19万㎡万象城级商业+340㎡云端平墅。",
places:[{name:"绿汀路站",desc:"3/5/16号线三地铁上盖"},{name:"万象城级商业",desc:"约19万㎡自持商业"}],
features:["超100万㎡TOD生活聚场","340㎡云端平墅·总价800-1000万+","自带2000㎡高端双会所"],
spots:[{tag:"design",name:"考察重点",desc:"TOD综合体动线设计、住宅与会所连接"},{tag:"design",name:"关注",desc:"华润'瑞玺'产品线精装标准"},{tag:"tip",name:"拍照",desc:"户型样板间装修细节"}],
history:"杭珹未来中心是华润置地在未来科技城的旗舰TOD项目，位于绿汀路站三地铁上盖。总体量超100万㎡，包含高端住宅、万象城级商业、写字楼等业态。住宅部分\"瑞玺\"艺术馆已开放，主打340㎡云端大平层，总价千万级。"},
{d:"14:00",name:"中海·玖序+保利·天珺",lat:30.222161,lng:120.253197,type:"star",title:"中海玖序 × 保利天珺 | 奥体双盘",brief:"中海联手扎哈·哈迪德事务所打造钱湾玖序；保利天系TOP级·奥体最后一块涉宅地。",
places:[{name:"钱江世纪城奥博中心",desc:"奥体核心区"},{name:"SKP/杭州之门",desc:"周边顶配商业地标"}],
features:["中海·玖序：扎哈·哈迪德事务所参与","中海·万潮玖序：230-420㎡","保利·天珺：2026Q1杭州销冠","天珺首开均价74422元/㎡"],
spots:[{tag:"design",name:"中海考察重点",desc:"扎哈设计的'都会峡谷'景观"},{tag:"design",name:"保利考察重点",desc:"天系TOP级产品标准"},{tag:"tip",name:"对比",desc:"中海玖序vs保利天珺差异化定位"}],
history:"中海玖序位于钱江世纪城，联手扎哈·哈迪德建筑事务所设计，打造'都会峡谷'立体景观，主力230-420㎡。保利天珺位于奥博中心单元，是奥体区域最后一块涉宅地，2026年一季度登顶杭州住宅销售金额榜首。"}
];

const routeStops=[
{name:"晶悦府",lat:30.3370,lng:120.1644},
{name:"栖湖云庄",lat:30.285581,lng:120.074507},
{name:"杭珹未来中心",lat:30.259402,lng:119.993425},
{name:"奥体双盘",lat:30.222161,lng:120.253197}
];

let map,driving;
function initMap(){
map=new AMap.Map('map',{zoom:10,center:[120.12,30.28],mapStyle:'amap://styles/whitesmoke'});
const icons=["🏠","🏗️","🚗","🏗️","🍽️","🚗","🏗️","🏠"];
stops.forEach((s,i)=>{
const el=document.createElement('div');
el.innerHTML=`<div style="background:${s.type==='star'?'#1a5276':'#555'};color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">${icons[i]||'📍'}</div>`;
const m=new AMap.Marker({position:[s.lng,s.lat],content:el,map,zIndex:s.type==='star'?100:80,bubble:true});
m.on('click',()=>selectCity(i));
});
driving=new AMap.Driving({map,policy:AMap.DrivingPolicy.LEAST_TIME,hideMarkers:true,isOutline:true,outlineColor:'#ffffff',autoFitView:false});
const start=routeStops[0],end=routeStops[routeStops.length-1],passes=routeStops.slice(1,-1).map(p=>new AMap.LngLat(p.lng,p.lat));
driving.search(new AMap.LngLat(start.lng,start.lat),new AMap.LngLat(end.lng,end.lat),{waypoints:passes},(s,r)=>{if(s==='complete')driving.search(r);});
}
function selectCity(i){
const s=stops[i];
if(isMobile())showMobileSheet(i);else openInfoWindow(i);
document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('active'));
document.querySelector(`.tl-item[data-i="${i}"]`)?.classList.add('active');
}
function openInfoWindow(i){
const s=stops[i];const z=map.getZoom();
map.setZoomAndCenter(Math.max(z,12),[s.lng,s.lat+(z>=12?0.12:0.5)],false,400);
const spotsHtml=(s.spots||[]).map(sp=>`<div class="spot spot-${sp.tag}"><div class="spot-name">${sp.name}</div><div class="spot-desc">${sp.desc}</div></div>`).join('');
const featuresHtml=(s.features||[]).map(f=>`<div class="iw-feature">${f}</div>`).join('');
const content=`<div class="iw"><div class="iw-head"><div class="iw-date">${s.d}</div><div class="iw-title">${s.title}</div></div><div class="iw-brief">${s.brief}</div>${featuresHtml}<div class="iw-spots">${spotsHtml}</div>${s.history?`<div class="iw-history">${s.history}</div>`:''}</div>`;
const iw=new AMap.InfoWindow({content,offset:new AMap.Pixel(0,-38),autoMove:false,closeWhenClickMap:true});
iw.open(map,[s.lng,s.lat]);
}
function showMobileSheet(i){document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.tl-item')[i]?.classList.add('active');}
function setDrawer(s){document.getElementById('timeline').dataset.state=s;}
function isMobile(){return window.innerWidth<=767;}
document.querySelectorAll('.tl-item').forEach(el=>{el.addEventListener('click',()=>{const i=parseInt(el.dataset.i);if(isMobile()){showMobileSheet(i);setDrawer('half');}else selectCity(i);});});
const sc=document.createElement('script');
sc.src=`https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Driving`;
sc.onload=initMap;
document.head.appendChild(sc);
</script>
<script>
document.getElementById('rb-open').addEventListener('click',()=>{document.getElementById('rb-panel').classList.add('open');document.getElementById('rb-overlay').classList.add('show');buildRoadbook();});
document.getElementById('rb-close').addEventListener('click',closeRb);
document.getElementById('rb-overlay').addEventListener('click',closeRb);
function closeRb(){document.getElementById('rb-panel').classList.remove('open');document.getElementById('rb-overlay').classList.remove('show');}
function buildRoadbook(){
const days=[
{d:"上午",city:"晶悦府→建发栖湖云庄",km:"~18km",
entries:[{time:"08:30",cls:"drive",action:"晶悦府出发",note:"留石快速路西行→蒋村"},{time:"09:00",cls:"",action:"抵达栖湖云庄",note:""}]},
{d:"上午",city:"🏗️ 建发·栖湖云庄",km:"蒋村·西溪湿地",
entries:[{time:"09:10",cls:"key",action:"项目外围考察",note:"排屋立面、新中式风格"},{time:"09:40",cls:"key",action:"示范区参观",note:"样板间动线、精装标准、景观"},{time:"10:15",cls:"",action:"周边西溪湿地环境",note:"了解板块成熟度"}]},
{d:"上午",city:"栖湖云庄→杭珹未来中心",km:"~10km",
entries:[{time:"10:30",cls:"drive",action:"蒋村→未来科技城",note:"文一西路直达"},{time:"10:45",cls:"",action:"抵达杭珹未来中心",note:""}]},
{d:"上午",city:"🏗️ 华润·杭珹未来中心",km:"未来科技城·TOD",
entries:[{time:"10:50",cls:"key",action:"瑞玺艺术馆参观",note:"340㎡云端平墅样板间"},{time:"11:30",cls:"key",action:"TOD综合体动线",note:"住宅-商业-地铁连接关系"},{time:"12:00",cls:"",action:"周边配套考察",note:"万象城商业进度"},{time:"12:30",cls:"",action:"午餐",note:"杭珹周边用餐"}]},
{d:"下午",city:"杭珹→奥体",km:"~25km",
entries:[{time:"13:30",cls:"drive",action:"未来科技城→奥体",note:"文一西路→紫金港隧道→上塘高架→过江"},{time:"13:55",cls:"",action:"抵达奥体板块",note:""}]},
{d:"下午",city:"🏗️ 中海玖序+保利天珺",km:"奥体·世纪城",
entries:[{time:"14:00",cls:"key",action:"中海玖序考察",note:"钱湾玖序·扎哈设计概念"},{time:"14:50",cls:"key",action:"保利天珺考察",note:"天系TOP级产品标准"},{time:"15:20",cls:"",action:"对比总结",note:"两盘差异化与定位"}]},
{d:"傍晚",city:"奥体→晶悦府",km:"~15km",
entries:[{time:"15:30",cls:"drive",action:"返程回家",note:"过江→上塘高架北上"},{time:"15:55",cls:"",action:"到家",note:""}]}
];
document.getElementById('rb-body').innerHTML=days.map(day=>{
const entries=day.entries.map(e=>`<div class="rb-entry ${e.cls||''}"><div class="rb-time">${e.time}</div><div class="rb-entry-right"><div class="rb-action">${e.action}</div>${e.note?`<div class="rb-note">${e.note}</div>`:''}</div></div>`).join('');
return `<div class="rb-day"><div class="rb-day-head"><span class="rb-day-date">${day.d}</span><span class="rb-day-city">${day.city}</span><span class="rb-day-km">${day.km}</span></div><div class="rb-entries">${entries}</div></div>`;
}).join('');
}
</script>
</body>
</html>

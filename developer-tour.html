<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房企考察·华润×建发×中海×保利</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--white:#faf9f7;--bd:#e8e4df;--text:#2c2c2c;--muted:#8a8681;--accent:#1a5276}
body{font-family:'Noto Sans SC','PingFang SC',system-ui,sans-serif;background:var(--white);color:var(--text);display:grid;grid-template-columns:148px 1fr;height:100vh;overflow:hidden}
#timeline{width:148px;overflow-y:auto;padding:16px 0;background:var(--white);border-right:1px solid var(--bd)}
.tl-item{padding:10px 14px;cursor:pointer;border-left:3px solid transparent}
.tl-item:hover{background:#f0ede8}
.tl-item.active{border-left-color:var(--accent);background:#f5f0ea}
.tl-item .tl-date{font-size:11px;color:var(--muted)}
.tl-item .tl-name{font-size:13px;font-weight:600;margin-top:2px}
.tl-item .tl-brief{font-size:10px;color:var(--muted);margin-top:2px}
.tl-item .tl-time{font-size:10px;color:var(--accent);margin-top:2px}
.tl-divider{height:20px}
#map-wrap{position:relative;overflow:hidden}
#map{height:100vh;width:100%}
.iw{max-width:320px;font-family:'Noto Sans SC',system-ui,sans-serif}
.iw-head{border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px}
.iw-date{font-size:11px;color:var(--muted)}
.iw-title{font-size:18px;font-weight:700;margin-top:2px}
.iw-brief{font-size:13px;line-height:1.6;margin:8px 0;color:#444}
.iw-feature{font-size:12px;margin:6px 0;padding-left:14px}
.iw-spots{margin-top:10px}
.spot{padding:6px 10px;margin:4px 0;border-radius:6px;font-size:12px}
.spot-design{background:#e8f0f8}
.spot-tip{background:#f0f5e8}
.spot-name{font-weight:600}
.spot-desc{color:#555;margin-top:2px}
.iw-history{margin-top:8px;padding:8px 10px;background:#faf5ee;border-radius:6px;font-size:12px;line-height:1.6}
#rb-btn{position:fixed;top:16px;right:16px;z-index:200}
.rb-trigger{background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.rb-trigger:hover{background:#0e3a55}
#rb-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none}
#rb-panel{position:fixed;top:0;left:0;bottom:0;width:380px;max-width:90vw;background:var(--white);z-index:400;transform:translateX(-100%);transition:transform .35s cubic-bezier(.32,0,.15,1);overflow-y:auto}
#rb-panel.open{transform:translateX(0)}
#rb-overlay.show{display:block}
#rb-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}
#rb-header span{font-size:16px;font-weight:700}
#rb-close{background:none;border:none;font-size:20px;cursor:pointer;padding:4px}
#rb-body{padding:16px 20px}
.rb-day{margin-bottom:24px}
.rb-day-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rb-day-date{font-size:13px;font-weight:700;color:var(--accent)}
.rb-day-city{font-size:14px;font-weight:600}
.rb-day-km{font-size:11px;color:var(--muted)}
.rb-entries{margin-top:8px}
.rb-entry{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #f0ede8}
.rb-time{font-size:11px;color:var(--muted);font-weight:600}
.rb-action{font-size:13px}
.rb-note{font-size:11px;color:var(--muted);margin-top:1px}
.rb-entry.drive .rb-action{color:var(--accent)}
.rb-entry.key .rb-action{font-weight:600}
@media(max-width:767px){
body{grid-template-columns:1fr}
#timeline{position:fixed;left:0;right:0;bottom:0;width:100%;height:85vh;border-radius:18px 18px 0 0;transform:translateY(calc(85vh - 72px));transition:transform .38s;z-index:500;overflow-y:auto;background:var(--white)}
#timeline[data-state="half"]{transform:translateY(calc(85vh - 40vh))}
#timeline[data-state="full"]{transform:translateY(0)}
.amap-info-outer{display:none!important}
#rb-panel{width:100vw;max-width:100vw}
}
</style>
</head>
<body>
<div id="timeline" data-state="closed">
<div class="tl-item active" data-i="0"><div class="tl-date">08:30</div><div class="tl-name">晶悦府→杭珹</div><div class="tl-brief">出发·约40min</div><div class="tl-time">🚗 未来科技城</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="1"><div class="tl-date">09:15–11:30</div><div class="tl-name">华润·杭珹</div><div class="tl-brief">未来科技城·TOD</div><div class="tl-time">🏗️ 华润</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="2"><div class="tl-date">11:30–12:30</div><div class="tl-name">午餐</div><div class="tl-brief">杭珹周边</div><div class="tl-time">🍽️</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="3"><div class="tl-date">12:30–13:10</div><div class="tl-name">杭珹→建发</div><div class="tl-brief">驾车约30min</div><div class="tl-time">🚗 蒋村</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="4"><div class="tl-date">13:10–14:30</div><div class="tl-name">建发·栖湖云庄</div><div class="tl-brief">蒋村·杭州地王</div><div class="tl-time">🏗️ 建发</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="5"><div class="tl-date">14:30–15:10</div><div class="tl-name">建发→奥体</div><div class="tl-brief">驾车约25min过江</div><div class="tl-time">🚗 过江</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="6"><div class="tl-date">15:10–16:30</div><div class="tl-name">中海+保利</div><div class="tl-brief">奥体·世纪城</div><div class="tl-time">🏗️ 中海·保利</div></div>
<div class="tl-divider"></div>
<div class="tl-item" data-i="7"><div class="tl-date">16:30–17:00</div><div class="tl-name">奥体→晶悦府</div><div class="tl-brief">驾车约25min</div><div class="tl-time">🏠 回家</div></div>
</div>
<div id="map-wrap">
<div id="map"></div>
<div id="rb-btn"><div class="rb-trigger" id="rb-open">📋 考察路书</div></div>
<div id="rb-overlay"></div>
<div id="rb-panel"><div id="rb-header"><span>📋 考察路书</span><button id="rb-close">✕</button></div><div id="rb-body"></div></div>
</div>
<script>
var AMAP_KEY='45cbf43f4675e9b9377fa955a6b1e996';
var AMAP_SECRET='830b90a26c3b039ba69daccced906ba1';
window._AMapSecurityConfig={securityJsCode:AMAP_SECRET};

var stops=[
{d:"08:30",name:"晶悦府",lat:30.3370,lng:120.1644,title:"出发",brief:"拱墅铁路北→未来科技城"},
{d:"09:15",name:"华润·杭珹未来中心",lat:30.259402,lng:119.993425,title:"华润置地·未来科技城TOD",brief:"绿汀路三地铁上盖·超100万㎡综合体",
features:["340㎡云端平墅","万象城级19万㎡商业","三地铁绿汀路站上盖"],
spots:[{name:"考察重点",desc:"TOD动线、住宅与商业连接"},{name:"瑞玺产品",desc:"华润高端平墅精装标准"}],
history:"华润置地在未来科技城的旗舰TOD，含高端住宅、万象城级商业、写字楼。"},
{d:"12:30",name:"建发·栖湖云庄",lat:30.285581,lng:120.074507,title:"建发·蒋村地王",brief:"西溪湿地旁·楼面价88029元/㎡创纪录·83套4层排屋",
features:["102轮竞价溢价115%","容积率1.1纯低密","总价3000万+"],
spots:[{name:"考察重点",desc:"新中式排屋立面、园区景观"},{name:"关注",desc:"低密产品空间尺度与精装"}],
history:"建发经102轮竞价以34.35亿夺得蒋村地块，楼面价88029元/㎡刷新杭州纪录。"},
{d:"15:10",name:"中海玖序+保利天珺",lat:30.222161,lng:120.253197,title:"奥体双盘",brief:"中海联手扎哈事务所·保利天系TOP级",
features:["中海·万潮玖序230-420㎡","保利天珺74422元/㎡首开","2026Q1杭州销冠"],
spots:[{name:"中海重点",desc:"扎哈'都会峡谷'景观"},{name:"保利重点",desc:"天系TOP级产品标准"}],
history:"中海钱湾玖序联手扎哈·哈迪德建筑事务所。保利天珺为奥体最后涉宅地。"}
];

var map=null;
function initMap(){
map=new AMap.Map('map',{zoom:11,center:[120.13,30.27],mapStyle:'amap://styles/whitesmoke'});
addMarkers();
addRoute();
}
function addMarkers(){
var icons=["🏠","🏗️","🍽️","🚗","🏗️","🚗","🏗️","🏠"];
for(var i=0;i<stops.length;i++){
(function(s,idx){
var el=document.createElement('div');
var bg=s.name.indexOf('华润')>-1||s.name.indexOf('建发')>-1||s.name.indexOf('中海')>-1?'#1a5276':'#555';
el.innerHTML='<div style="background:'+bg+';color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">'+(icons[idx]||'📍')+'</div>';
var m=new AMap.Marker({position:[s.lng,s.lat],content:el,map:map,zIndex:s.name.indexOf('华润')>-1||s.name.indexOf('建发')>-1||s.name.indexOf('中海')>-1?100:80,bubble:true});
m.on('click',function(){selectCity(idx);});
})(stops[i],i);
}
// 中海万潮玖序独立标记
(function(){
var el=document.createElement('div');
el.innerHTML='<div style="background:#c0392b;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;box-shadow:0 3px 8px rgba(0,0,0,0.4);border:2px solid #fff">海</div>';
new AMap.Marker({position:[120.211325,30.214436],content:el,map:map,zIndex:110,bubble:true});
})();
// 保利天珺独立标记
(function(){
var el=document.createElement('div');
el.innerHTML='<div style="background:#2d7d46;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;box-shadow:0 3px 8px rgba(0,0,0,0.4);border:2px solid #fff">珺</div>';
new AMap.Marker({position:[120.253197,30.222161],content:el,map:map,zIndex:110,bubble:true});
})();
}
function addRoute(){
var start=new AMap.LngLat(120.1644,30.3370);
var pass1=new AMap.LngLat(119.993425,30.259402);
var pass2=new AMap.LngLat(120.074507,30.285581);
var end=new AMap.LngLat(120.253197,30.222161);
var dr=new AMap.Driving({map:map,policy:AMap.DrivingPolicy.LEAST_TIME,hideMarkers:true,isOutline:true,outlineColor:'#ffffff',autoFitView:false});
dr.search(start,end,{waypoints:[pass1,pass2]},function(s,r){if(s==='complete')dr.search(r);});
}
function selectCity(i){
document.querySelectorAll('.tl-item').forEach(function(el){el.classList.remove('active');});
var el=document.querySelector('.tl-item[data-i="'+i+'"]');
if(el)el.classList.add('active');
if(isMobile())return;
var s=i<4?stops[i]:stops[stops.length-1];
var z=map.getZoom();
map.setZoomAndCenter(Math.max(z,13),[s.lng,s.lat+(z>=12?0.1:0.3)],false,400);
var spotsHtml='';if(s.spots){for(var j=0;j<s.spots.length;j++){spotsHtml+='<div class="spot spot-design"><div class="spot-name">'+s.spots[j].name+'</div><div class="spot-desc">'+s.spots[j].desc+'</div></div>';}}
var featuresHtml='';if(s.features){for(var j=0;j<s.features.length;j++){featuresHtml+='<div class="iw-feature">'+s.features[j]+'</div>';}}
var content='<div class="iw"><div class="iw-head"><div class="iw-date">'+s.d+'</div><div class="iw-title">'+(s.title||'')+'</div></div><div class="iw-brief">'+s.brief+'</div>'+featuresHtml+'<div class="iw-spots">'+spotsHtml+'</div>'+(s.history?'<div class="iw-history">'+s.history+'</div>':'')+'</div>';
var iw=new AMap.InfoWindow({content:content,offset:new AMap.Pixel(0,-38),autoMove:false,closeWhenClickMap:true});
iw.open(map,[s.lng,s.lat]);
}
function isMobile(){return window.innerWidth<=767;}
document.querySelectorAll('.tl-item').forEach(function(el){
el.addEventListener('click',function(){
var i=parseInt(el.dataset.i);
document.querySelectorAll('.tl-item').forEach(function(e){e.classList.remove('active');});
el.classList.add('active');
if(isMobile()){document.getElementById('timeline').dataset.state='half';}else{selectCity(i);}
});
});
var sc=document.createElement('script');
sc.src=`https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Driving`;
sc.onload=initMap;
document.head.appendChild(sc);
</script>
<script>
document.getElementById('rb-open').addEventListener('click',function(){
document.getElementById('rb-panel').classList.add('open');
document.getElementById('rb-overlay').classList.add('show');
buildRoadbook();
});
document.getElementById('rb-close').addEventListener('click',function(){
document.getElementById('rb-panel').classList.remove('open');
document.getElementById('rb-overlay').classList.remove('show');
});
document.getElementById('rb-overlay').addEventListener('click',function(){
document.getElementById('rb-panel').classList.remove('open');
document.getElementById('rb-overlay').classList.remove('show');
});
function buildRoadbook(){
var days=[
{d:"上午",city:"晶悦府→华润杭珹",km:"~25km",entries:[{t:"08:30",c:"drive",a:"晶悦府出发",n:"留石快速路西行至未来科技城"},{t:"09:10",c:"",a:"抵达杭珹未来中心·瑞玺艺术馆",n:""}]},
{d:"上午",city:"华润·杭珹未来中心",km:"未来科技城TOD",entries:[{t:"09:15",c:"key",a:"瑞玺艺术馆参观",n:"340㎡云端平墅样板间"},{t:"10:00",c:"key",a:"TOD动线考察",n:"住宅-商业-地铁连接"},{t:"10:45",c:"",a:"万象城商业进度"},{t:"11:30",c:"",a:"午餐",n:"杭珹周边"}]},
{d:"下午",city:"杭珹→建发栖湖云庄",km:"~15km",entries:[{t:"12:30",c:"drive",a:"未来科技城→蒋村",n:"文一西路东行"},{t:"12:55",c:"",a:"抵达栖湖云庄",n:""}]},
{d:"下午",city:"建发·栖湖云庄",km:"蒋村·西溪",entries:[{t:"13:10",c:"key",a:"排屋立面考察",n:"新中式风格"},{t:"13:45",c:"key",a:"示范区参观",n:"空间尺度与景观"},{t:"14:15",c:"",a:"西溪湿地周边环境"}]},
{d:"下午",city:"建发→奥体",km:"~20km",entries:[{t:"14:30",c:"drive",a:"蒋村→奥体",n:"紫金港路→上塘高架→过江"},{t:"14:55",c:"",a:"抵达奥体",n:""}]},
{d:"下午",city:"中海玖序+保利天珺",km:"奥体·世纪城",entries:[{t:"15:10",c:"key",a:"中海·万潮玖序",n:"扎哈'都会峡谷'概念"},{t:"16:00",c:"key",a:"保利·天珺",n:"天系TOP·杭州销冠"},{t:"16:20",c:"",a:"对比总结"}]},
{d:"傍晚",city:"奥体→晶悦府",km:"~15km",entries:[{t:"16:30",c:"drive",a:"返程回家",n:"过江→上塘高架北上"},{t:"16:55",c:"",a:"到家",n:""}]}
];
var html='';
for(var i=0;i<days.length;i++){
var d=days[i];
var entries='';
for(var j=0;j<d.entries.length;j++){
var e=d.entries[j];
entries+='<div class="rb-entry '+(e.c||'')+'"><div class="rb-time">'+e.t+'</div><div class="rb-entry-right"><div class="rb-action">'+e.a+'</div>'+(e.n?'<div class="rb-note">'+e.n+'</div>':'')+'</div></div>';
}
html+='<div class="rb-day"><div class="rb-day-head"><span class="rb-day-date">'+d.d+'</span><span class="rb-day-city">'+d.city+'</span><span class="rb-day-km">'+d.km+'</span></div><div class="rb-entries">'+entries+'</div></div>';
}
document.getElementById('rb-body').innerHTML=html;
}
</script>
</body>
</html>

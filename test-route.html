<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
<title>骑行路线：晶悦府→杨公堤→南山路→回家</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
  .header {
    background: linear-gradient(135deg, #1a6b3a, #2d8a4e);
    color: white;
    padding: 16px;
    text-align: center;
  }
  .header h1 { font-size: 18px; margin-bottom: 2px; }
  .header p { font-size: 12px; opacity: 0.85; }

  .route-info {
    background: white;
    padding: 12px 16px;
    display: flex;
    justify-content: space-around;
    font-size: 13px;
    border-bottom: 1px solid #eee;
  }
  .route-info span { text-align: center; }
  .route-info .num { font-weight: 700; color: #2d8a4e; font-size: 15px; }
  .route-info .label { color: #888; font-size: 11px; }

  .map-container {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 75%; /* 4:3 aspect ratio */
  }
  .map-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .note {
    padding: 12px 16px;
    background: #fff8e1;
    font-size: 13px;
    line-height: 1.6;
    color: #795548;
  }
  .note a { color: #2d8a4e; }

  .btn-open {
    display: block;
    margin: 16px auto;
    background: #2d8a4e;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    width: 80%;
    max-width: 300px;
  }
  .btn-open:active { background: #1a6b3a; }
</style>
</head>
<body>

<div class="header">
  <h1>🚴 骑行路线验证</h1>
  <p>和旭晶悦府 → 杨公堤 → 南山路 → 回家</p>
</div>

<div class="route-info">
  <span>
    <div class="num">31 km</div>
    <div class="label">总距离</div>
  </span>
  <span>
    <div class="num">3h 6min</div>
    <div class="label">预计时间</div>
  </span>
  <span>
    <div class="num">39%</div>
    <div class="label">林荫路段</div>
  </span>
  <span>
    <div class="num">77</div>
    <div class="label">红绿灯</div>
  </span>
</div>

<div class="map-container">
  <iframe src="https://uri.amap.com/route?from=和旭晶悦府(120.164353,30.337044)&to=和旭晶悦府(120.164353,30.337044)&via1=杨公堤(120.132720,30.239869)&via2=南山路(120.147631,30.229388)&mode=cycling&policy=1" allowfullscreen>
  </iframe>
</div>

<div class="note">
  <b>📌 如果显示"请在高德App中打开"</b><br>
  说明当前页面直接 iframe 高德路线暂不支持。<br>
  请点击下方按钮在高德App中查看完整骑行路线 👇
</div>

<a class="btn-open" href="https://uri.amap.com/route?from=和旭晶悦府(120.164353,30.337044)&to=和旭晶悦府(120.164353,30.337044)&via1=杨公堤(120.132720,30.239869)&via2=南山路(120.147631,30.229388)&mode=cycling&policy=1" target="_blank">
  📱 在高德App中查看路线
</a>

</body>
</html>

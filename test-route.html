<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
<title>骑行测试：晶悦府→杨公堤→南山路→回家</title>
<style>
  html,body,#container{width:100%;height:100%;margin:0;padding:0;}
  #panel{position:fixed;background-color:white;max-height:90%;overflow-y:auto;top:10px;right:10px;width:280px;border-radius:4px;overflow:hidden;z-index:1000;display:none;}
  .info{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:8px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.15);font-size:13px;max-width:200px;}
</style>
</head>
<body>
<div id="container"></div>
<div id="panel"></div>
<div class="info">
  <b>🚴 测试路线</b><br>
  晶悦府→杨公堤→南山路→回家<br>
  <span style="color:#888;font-size:11px;">对比高德App骑行路线</span>
</div>

<script src="https://webapi.amap.com/maps?v=2.0&key=45cbf43f4675e9b9377fa955a6b1e996&plugin=AMap.Riding&securityJsCode=830b90a26c3b039ba69daccced906ba1"></script>
<script>
var map = new AMap.Map("container", {
  resizeEnable: true,
  center: [120.15, 30.28],
  zoom: 12,
  mapStyle: 'amap://styles/fresh'
});

// 路线：晶悦府→杨公堤→南山路→晶悦府
var segs = [
  { from: [120.164353, 30.337044], to: [120.132720, 30.239869], label: '家→杨公堤' },  // 晶悦府到杨公堤
  { from: [120.132720, 30.239869], to: [120.147631, 30.229393], label: '杨公堤→南山路' }, // 杨公堤到南山路
  { from: [120.147631, 30.229393], to: [120.164353, 30.337044], label: '南山路→家' },    // 南山路回家
];

// Start marker
new AMap.Marker({
  position: [120.164353, 30.337044],
  label: { content: '<div style="background:#2d8a4e;color:white;padding:2px 8px;border-radius:4px;font-size:12px;">🏠 晶悦府</div>', direction: 'top', offset: new AMap.Pixel(-30, 0) }
}).setMap(map);

// End marker
new AMap.Marker({
  position: [120.132720, 30.239869],
  label: { content: '<div style="background:#e74c3c;color:white;padding:2px 8px;border-radius:4px;font-size:12px;">📍 杨公堤</div>', direction: 'top', offset: new AMap.Pixel(-30, 0) }
}).setMap(map);

new AMap.Marker({
  position: [120.147631, 30.229393],
  label: { content: '<div style="background:#3498db;color:white;padding:2px 8px;border-radius:4px;font-size:12px;">📍 南山路</div>', direction: 'top', offset: new AMap.Pixel(-30, 0) }
}).setMap(map);

var riding = new AMap.Riding({
  map: map,
  panel: 'panel',
  policy: AMap.RidingPolicy.RECOMMENDED,
});

var idx = 0;
function nextSeg() {
  if (idx >= segs.length) {
    map.setFitView(null, false, [30,30,30,30]);
    return;
  }
  var seg = segs[idx];
  idx++;
  riding.search(seg.from, seg.to, function(status, result) {
    if (status === 'complete') {
      console.log('✓ ' + seg.label);
    } else {
      console.log('✗ ' + seg.label + ': ' + status);
    }
    setTimeout(nextSeg, 500);
  });
}
setTimeout(nextSeg, 500);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杭州商场考察 · 室内设计 · 2026.5.8</title>
<meta name="description" content="晶悦府→城北万象城→恒隆广场→杭州万象城→天目里">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--white:#fff;--bd:#e8e8ed;--text:#1d1d1f;--text2:#86868b;--text3:#aeaeb2;--accent:#007aff;--bg:#f5f5f7;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--blue:#007aff;--purple:#af52de}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
#app{display:grid;grid-template-columns:148px 1fr;height:100vh;overflow:hidden}
#timeline{width:148px;overflow-y:auto;background:var(--white);border-right:1px solid var(--bd);padding:60px 0 20px}
.tl-item{padding:10px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .2s}
.tl-item:hover,.tl-item.active{background:var(--bg);border-left-color:var(--accent)}
.tl-item .tl-date{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.02em}
.tl-item .tl-name{font-size:13px;font-weight:600;margin:2px 0;color:var(--text)}
.tl-item .tl-time{font-size:11px;color:var(--text2)}
.tl-item .tl-type{font-size:10px;color:var(--text3);margin-top:2px}
#map-wrap{position:relative;overflow:hidden}
#map{height:100vh;width:100%}
.amap-info-content{border-radius:12px!important;padding:0!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important}
.amap-info-sharp{display:none!important}
.iw{font-size:13px;line-height:1.5;padding:10px}
.iw-date{font-size:11px;color:var(--text3);font-weight:600}
.iw-title{font-size:17px;font-weight:700;margin:2px 0}
.iw-brief{font-size:13px;color:var(--text2);margin-bottom:6px;white-space:pre-line}
.iw-weather{background:#f0f7ff;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:6px;line-height:1.5}
.iw-spot{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--bd)}
.iw-spot:first-of-type{border-top:none;padding-top:0}
.iw-spot-icon{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.iw-spot-body{flex:1}
.iw-spot-name{font-weight:600;font-size:13px}
.iw-spot-desc{font-size:11px;color:var(--text2);margin-top:1px}
.iw-spot-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;margin-right:4px;font-weight:600}
.iw-spot-tag.food{background:rgba(255,59,48,.08);color:var(--red)}
.iw-spot-tag.tip{background:rgba(0,122,255,.08);color:var(--blue)}
.iw-spot-tag.must{background:rgba(52,199,89,.08);color:var(--green)}
#rb-btn{position:fixed;top:16px;right:16px;z-index:200;left:auto}
.rb-trigger{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:980px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:0 1px 8px rgba(0,0,0,.12);cursor:pointer;border:none;letter-spacing:-.01em}
#rb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
#rb-overlay.show{opacity:1;pointer-events:auto}
#rb-panel{position:fixed;top:0;left:0;bottom:0;width:360px;max-width:85vw;background:var(--white);z-index:301;transform:translateX(-100%);transition:transform .35s cubic-bezier(.22,1,.36,1);overflow-y:auto;box-shadow:2px 0 20px rgba(0,0,0,.12)}
#rb-panel.show{transform:translateX(0)}
#rb-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--white)}
#rb-header span{font-size:17px;font-weight:700}
#rb-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);font-size:16px;cursor:pointer}
#rb-body{padding:16px 20px 40px}
.rb-day{margin-bottom:24px}
.rb-day-head,.rb-day-head2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rb-day-date{font-size:11px;font-weight:600;color:var(--text3)}
.rb-day-city{font-size:16px;font-weight:700}
.rb-day-km{font-size:12px;color:var(--text2)}
.rb-day-weather{font-size:12px;color:var(--text2);margin:4px 0 8px}
.rb-entry{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.rb-time{font-size:11px;font-weight:600;color:var(--accent)}
.rb-action{font-size:13px;font-weight:500}
.rb-note{font-size:11px;color:var(--text2);margin-top:1px}
.rb-entry.drive .rb-time{color:var(--text3)}
.rb-entry.key .rb-time{color:var(--green)}
.rb-spots{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.rb-spot-item{padding:4px 0;font-size:13px}
@media(max-width:767px){
  #app{grid-template-columns:1fr}
  #timeline{position:fixed;left:0;right:0;bottom:0;width:100%;height:80vh;z-index:500;border-radius:18px 18px 0 0;border-right:none;box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:24px 0 20px;transform:translateY(calc(80vh - 64px));transition:transform .38s cubic-bezier(.32,0,.15,1)}
  #timeline[data-state="half"]{transform:translateY(calc(80vh - 50vh))}
  #timeline[data-state="full"]{transform:translateY(0)}
}
</style>
</head>
<body>
<div id="app">
  <div id="timeline"></div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="rb-btn"><button class="rb-trigger" id="rb-open">📖 文字路书</button></div>
  </div>
</div>
<div id="rb-overlay"></div>
<div id="rb-panel">
  <div id="rb-header"><span>📖 文字路书</span><button id="rb-close">✕</button></div>
  <div id="rb-body"></div>
</div>
<script>
const AMAP_KEY='uguEzcgs7bGNgkGLSGPWdtdU';
const AMAP_SECRET='Yar09231013';
window._AMapSecurityConfig={securityJsCode:AMAP_SECRET};
const sc=document.createElement('script');
sc.src=`https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Driving,AMap.Geocoder`;
document.head.appendChild(sc);

// 数据
const weather={"MAY 8":{icon:"☁️",desc:"阴有微雨",hi:22,lo:14,wind:"东南风3级",rain:0.1,note:"降水概率27%，带把伞"}};

// 用精确地址和高德地理编码来定位
const addressData=[
  {name:"晶悦府",addr:"杭州拱墅区晶悦府",desc:"出发",tag:"start"},
  {name:"城北万象城",addr:"杭州余杭区良渚街道城北万象城",desc:"区域型商业精装",tag:"mall"},
  {name:"杭州恒隆广场",addr:"杭州拱墅区武林广场恒隆广场",desc:"高端商业设计+午餐",tag:"lunch"},
  {name:"杭州万象城",addr:"杭州上城区钱江新城富春路701号杭州万象城",desc:"大型商业室内体系",tag:"mall"},
  {name:"天目里",addr:"杭州西湖区天目山路天目里",desc:"清水混凝土·复合空间",tag:"art"},
  {name:"返回晶悦府",addr:"杭州拱墅区晶悦府",desc:"返回",tag:"end"}
];
const stops=[];
const iconConf={t:{start:'#4caf50',mall:'#1976d2',lunch:'#f57c00',art:'#7b1fa2',end:'#4caf50'}};
const spotData=[
  [{tag:"tip",name:"建议",desc:"检查车况、带卷尺"}],
  [{tag:"must",name:"中庭动线",desc:"垂直交通与公共空间组织"},{tag:"must",name:"材料搭配",desc:"石材/金属/玻璃应用"},{tag:"must",name:"门头统装",desc:"店铺门头标准化设计"},{tag:"tip",name:"卫生间",desc:"精装标准与母婴室"},{tag:"tip",name:"导视系统",desc:"标识设计信息层级"}],
  [{tag:"must",name:"奢侈品标准",desc:"高端商业室内设计细节"},{tag:"must",name:"灯光氛围",desc:"灯光设计营造空间感"},{tag:"must",name:"材质细节",desc:"天花/地面材质与衔接"},{tag:"tip",name:"动线布局",desc:"扶梯电梯垂直组织"},{tag:"food",name:"午餐",desc:"恒隆内或武林商圈"}],
  [{tag:"must",name:"设计体系",desc:"大型商业室内系统性"},{tag:"must",name:"施工工艺",desc:"材料选型与施工细节"},{tag:"must",name:"中庭采光",desc:"自然光与空间感"},{tag:"tip",name:"材质过渡",desc:"公共区与商业区衔接"}],
  [{tag:"must",name:"清水混凝土",desc:"施工工艺与质感"},{tag:"must",name:"复合空间",desc:"办公/商业/文化组织"},{tag:"tip",name:"下沉庭院",desc:"庭院与屋顶景观"},{tag:"tip",name:"建筑对话",desc:"商铺与建筑空间关系"}],
  [{tag:"tip",name:"晚餐",desc:"天目里解决再回"}]
];

sc.onload=()=>{
  const geocoder=new AMap.Geocoder({city:'杭州',radius:1000});
  let loaded=0;
  
  addressData.forEach((ad,i)=>{
    geocoder.getLocation(ad.addr,(status,result)=>{
      if(status==='complete'&&result.geocodes&&result.geocodes.length>0){
        const loc=result.geocodes[0];
        stops[i]={d:"MAY 8",name:ad.name,lat:loc.getLat(),lng:loc.getLng(),title:ad.desc,spots:spotData[i],tag:ad.tag};
      } else {
        stops[i]={d:"MAY 8",name:ad.name,lat:30.3,lng:120.16,title:ad.desc,spots:spotData[i],tag:ad.tag};
      }
      loaded++;
      if(loaded===addressData.length) initMap();
    });
  });
};

function initMap(){
  const map=new AMap.Map('map',{zoom:11,center:[120.17,30.28],mapStyle:'amap://styles/whitesmoke'});
  
  // 搜索驾车路线
  const driving=new AMap.Driving({policy:AMap.DrivingPolicy.LEAST_TIME});
  const waypoints=[];
  for(let i=1;i<stops.length-1;i++) waypoints.push(stops[i]);
  const start=stops[0],end=stops[stops.length-1];
  
  driving.search([start.lng,start.lat],[end.lng,end.lat],{waypoints:waypoints.map(w=>[w.lng,w.lat])},(s,r)=>{
    if(s==='complete'){
      const path=r.routes[0].steps.map(s=>s.path).flat();
      new AMap.Polyline({path,strokeColor:'#007aff',strokeWeight:4,strokeOpacity:.7,map});
    }
  });
  
  const markers=[];
  const times=['09:00','09:30','11:30','14:00','16:30','18:30'];

  stops.forEach((s,i)=>{
    const col=iconConf.t[s.tag]||'#007aff';
    const emoji=s.tag==='start'||s.tag==='end'?'🏠':s.tag==='lunch'?'🍽️':s.tag==='art'?'🎨':'🏬';
    
    const m=new AMap.Marker({
      position:[s.lng||120.17,s.lat||30.28],
      content:`<div style="width:32px;height:32px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18)"><span style="color:#fff;font-size:13px">${emoji}</span></div>`,
      offset:new AMap.Pixel(-16,-16),
      map
    });

    const spotsHtml=(s.spots||[]).map(sp=>
      `<div class="iw-spot"><div class="iw-spot-icon">${sp.tag==='food'?'🍽️':sp.tag==='tip'?'💡':'⭐'}</div><div class="iw-spot-body"><div class="iw-spot-name"><span class="iw-spot-tag ${sp.tag}">${sp.tag}</span>${sp.name}</div><div class="iw-spot-desc">${sp.desc}</div></div></div>`
    ).join('');
    
    const w=weather[s.d];
    m.on('click',()=>{
      map.setZoomAndCenter(15,[s.lng,s.lat],false,400);
      const iw=new AMap.InfoWindow({
        content:`<div class="iw"><div class="iw-date">${s.d}</div><div class="iw-title">${s.title||''}</div>${w?`<div class="iw-weather">${w.icon} ${w.desc} ${w.hi}°/${w.lo}° · ${w.wind}</div>`:''}<div class="iw-brief">${addressData[i].addr}</div>${spotsHtml}</div>`,
        offset:new AMap.Pixel(0,-38),
        autoMove:false,
        closeWhenClickMap:true
      });
      iw.open(map,[s.lng,s.lat]);
    });
    
    // 天气标签
    if(w){
      new AMap.Marker({
        position:[s.lng,s.lat],
        content:`<div style="background:rgba(255,255,255,.92);border-radius:8px;padding:4px 8px;box-shadow:0 1px 6px rgba(0,0,0,.1);text-align:center;font-size:12px;line-height:1.4;pointer-events:none"><div style="display:flex;align-items:center;gap:2px;justify-content:center"><span>${w.icon}</span><span style="font-weight:700">${w.hi}°</span>/<span style="color:var(--text2)">${w.lo}°</span></div><div style="font-size:9px;color:var(--text3)">${s.d}</div></div>`,
        offset:new AMap.Pixel(-32,-48),
        map
      });
    }
    
    markers.push(m);
  });
  
  // 时间轴
  const tl=document.getElementById('timeline');
  stops.forEach((s,i)=>{
    const d=document.createElement('div');d.className='tl-item';d.dataset.idx=i;
    d.innerHTML=`<div class="tl-date">${s.d}</div><div class="tl-name">${s.name}</div><div class="tl-time">${times[i]||''}</div><div class="tl-type">${s.title}</div>`;
    d.onclick=()=>{
      markers[i].emit('click');
      document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('active'));
      d.classList.add('active');
      if(window.innerWidth<=767)document.getElementById('timeline').dataset.state='half';
    };
    tl.appendChild(d);
  });
}

// 路书（等地图加载后再绑事件）
sc.onload2=()=>{
document.getElementById('rb-open').onclick=()=>{
  const roadbook=[{
    d:"MAY 8",city:"晶悦府→4个商场→返回",km:"全程约50km",weather:weather["MAY 8"],
    entries:[
      {time:"09:00",cls:"key",action:"🏠 晶悦府出发",note:"自驾/打车"},
      {time:"09:30",cls:"",action:"城北万象城·考察",note:"动线/材料/门头"},
      {time:"11:00",cls:"drive",action:"🚗 前往恒隆广场",note:"约20分钟"},
      {time:"11:30",cls:"key",action:"恒隆广场·考察+午餐",note:"精装/灯光/材质"},
      {time:"13:30",cls:"drive",action:"🚗 去杭州万象城",note:"约20分钟"},
      {time:"14:00",cls:"",action:"杭州万象城·考察",note:"设计体系/施工/中庭"},
      {time:"15:45",cls:"drive",action:"🚗 前往天目里",note:"约15分钟"},
      {time:"16:30",cls:"key",action:"天目里·考察",note:"清水混凝土/复合空间"},
      {time:"18:00",cls:"",action:"晚餐(天目里)",note:"茑屋咖啡或美食区"},
      {time:"18:30",cls:"key",action:"🏠 返回晶悦府",note:"约30分钟"}
    ]
  }];
  const body=document.getElementById('rb-body');
  body.innerHTML=roadbook.map(day=>{
    const entries=day.entries.map(e=>`<div class="rb-entry ${e.cls||''}"><div class="rb-time">${e.time}</div><div class="rb-entry-right"><div class="rb-action">${e.action}</div>${e.note?`<div class="rb-note">${e.note}</div>`:''}</div></div>`).join('');
    return `<div class="rb-day"><div class="rb-day-head2"><span class="rb-day-date">${day.d}</span><span class="rb-day-city">${day.city}</span><span class="rb-day-km">${day.km}</span></div><div class="rb-day-weather">${day.weather.icon} ${day.weather.desc} ${day.weather.hi}°/${day.weather.lo}°</div><div class="rb-entries">${entries}</div></div>`;
  }).join('');
  document.getElementById('rb-panel').classList.add('show');
  document.getElementById('rb-overlay').classList.add('show');
};
};
document.getElementById('rb-close').onclick=()=>{closeRB();};
document.getElementById('rb-overlay').onclick=()=>{closeRB();};
function closeRB(){
  document.getElementById('rb-panel').classList.remove('show');
  document.getElementById('rb-overlay').classList.remove('show');
}
</script>
</body>
</html>

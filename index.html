<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杭州商场考察 · 室内设计 · 2026.5.8</title>
<meta name="description" content="晶悦府→城北万象城→恒隆广场→杭州万象城→天目里">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --white: #fff; --bd: #e8e8ed; --text: #1d1d1f; --text2: #86868b; --text3: #aeaeb2;
  --accent: #007aff; --bg: #f5f5f7;
  --red: #ff3b30; --orange: #ff9500; --green: #34c759; --blue: #007aff; --purple: #af52de;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
a{color:var(--accent);text-decoration:none}

/* 双栏布局 */
#app{display:grid;grid-template-columns:148px 1fr;height:100vh;overflow:hidden}

/* 时间轴 */
#timeline{width:148px;overflow-y:auto;background:var(--white);border-right:1px solid var(--bd);padding:60px 0 20px}
.tl-item{padding:10px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .2s}
.tl-item:hover,.tl-item.active{background:var(--bg);border-left-color:var(--accent)}
.tl-item .tl-date{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.02em}
.tl-item .tl-name{font-size:13px;font-weight:600;margin:2px 0;color:var(--text)}
.tl-item .tl-time{font-size:11px;color:var(--text2)}
.tl-item .tl-type{font-size:10px;color:var(--text3);margin-top:2px}
.tl-item .tl-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}

/* 地图 */
#map-wrap{position:relative;overflow:hidden}
#map{height:100vh;width:100%}

/* 天气芯片 */
.wmk{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:8px;padding:4px 8px;box-shadow:0 1px 6px rgba(0,0,0,.1);text-align:center;font-size:12px;line-height:1.4;pointer-events:none}
.wmk .wmk-row{display:flex;align-items:center;gap:2px;justify-content:center}
.wmk .thi{font-weight:700;color:var(--text)}
.wmk .tlo{color:var(--text2)}
.wmk .wmk-date{font-size:9px;color:var(--text3)}

/* InfoWindow 样式 */
.iw{max-width:280px;font-size:13px;line-height:1.5}
.iw-head{margin-bottom:6px}
.iw-date{font-size:11px;color:var(--text3);font-weight:600}
.iw-title{font-size:17px;font-weight:700;color:var(--text);margin:2px 0}
.iw-brief{font-size:13px;color:var(--text2);margin-bottom:8px;line-height:1.5;white-space:pre-line}
.iw-weather{background:#f0f7ff;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:8px;line-height:1.5}
.iw-weather.risk{background:#fff3e0}
.iw-weather i{font-style:normal;display:inline-block;margin-top:2px;font-size:11px;color:var(--text2)}
.iw-spot{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.iw-spot:first-of-type{border-top:none;padding-top:0}
.iw-spot-icon{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.iw-spot-body{flex:1;min-width:0}
.iw-spot-name{font-weight:600;font-size:13px}
.iw-spot-desc{font-size:11px;color:var(--text2);margin-top:1px}
.iw-spot-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;margin-right:4px;font-weight:600}
.iw-spot-tag.food{background:rgba(255,59,48,.08);color:var(--red)}
.iw-spot-tag.tip{background:rgba(0,122,255,.08);color:var(--blue)}
.iw-spot-tag.warn{background:rgba(255,149,0,.08);color:var(--orange)}
.iw-spot-tag.must{background:rgba(52,199,89,.08);color:var(--green)}

/* 文字路书按钮 + 面板 */
#rb-btn{position:fixed;top:16px;right:16px;z-index:200}
.rb-trigger{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:980px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:0 1px 8px rgba(0,0,0,.12);cursor:pointer;border:none;letter-spacing:-.01em}
.rb-trigger:active{transform:scale(.96)}

#rb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
#rb-overlay.show{opacity:1;pointer-events:auto}

#rb-panel{position:fixed;top:0;left:0;bottom:0;width:360px;max-width:85vw;background:var(--white);z-index:301;transform:translateX(-100%);transition:transform .35s cubic-bezier(.22,1,.36,1);overflow-y:auto;box-shadow:2px 0 20px rgba(0,0,0,.12)}
#rb-panel.show{transform:translateX(0)}

#rb-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--white);z-index:1}
#rb-header span{font-size:17px;font-weight:700}
#rb-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
#rb-body{padding:16px 20px 40px}

.rb-day{margin-bottom:24px}
.rb-day-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rb-day-date{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.02em}
.rb-day-city{font-size:16px;font-weight:700}
.rb-day-km{font-size:12px;color:var(--text2)}
.rb-day-weather{font-size:12px;color:var(--text2);margin:4px 0 8px}

.rb-entry{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.rb-entry:last-child{border-bottom:none}
.rb-time{font-size:11px;font-weight:600;color:var(--accent);padding-top:1px}
.rb-entry-right{min-width:0}
.rb-action{font-size:13px;font-weight:500}
.rb-note{font-size:11px;color:var(--text2);margin-top:1px}
.rb-entry.drive .rb-time{color:var(--text3)}
.rb-entry.key .rb-time{color:var(--green)}

.rb-spots{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.rb-spots-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.rb-spot-item{padding:4px 0;font-size:13px}
.rb-spot-item .rb-note{font-size:11px;color:var(--text2)}

/* 移动端底部抽屉 */
@media (max-width:767px){
  #app{grid-template-columns:1fr}
  #timeline{position:fixed;left:0;right:0;bottom:0;width:100%;height:80vh;z-index:500;border-radius:18px 18px 0 0;border-right:none;box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:24px 0 20px;
    transform:translateY(calc(80vh - 64px));transition:transform .38s cubic-bezier(.32,0,.15,1)}
  #timeline[data-state="half"]{transform:translateY(calc(80vh - 50vh))}
  #timeline[data-state="full"]{transform:translateY(0)}
  .amap-info-outer{display:none!important}
  .leaflet-popup{display:none!important}
}

/* 标记样式 */
.mk-wrap{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.mk-start{background:#4caf50}
.mk-mall{background:#1976d2}
.mk-lunch{background:#f57c00}
.mk-end{background:#4caf50}
.mk-art{background:#7b1fa2}
</style>
</head>
<body>

<div id="app">

  </div>
</div>

<div id="rb-overlay"></div>
<div id="rb-panel">
  <div id="rb-header"><span>📖 文字路书</span><button id="rb-close">✕</button></div>
  <div id="rb-body"></div>

<script>

const stops = [
  { d:"MAY 8", name:"晶悦府", lat:30.3496, lng:120.1663,

    places:[],

  { d:"MAY 8", name:"城北万象城", lat:30.3457, lng:120.1015,
    title:"🏬 区域型商业精装",
    type:"star",
    brief:"华润城北新作，2023年开业，约15万㎡，勾庄板块",
    places:[],
    spots:[
      {tag:"must",name:"中庭动线",desc:"垂直交通与公共空间组织"},

const rbDays = [{
  d:"MAY 8", city:"晶悦府 → 4个商场 → 返回",
  km:"全程约50km（自驾）",
  weather:weather["MAY 8"],
  entries:[
    {time:"09:00", cls:"key", action:"🏠 晶悦府出发", note:"自驾/打车，带卷尺和笔记本"},
    {time:"09:30", cls:"", action:"城北万象城 · 考察", note:"重点：动线、材料、门头统装"},
    {time:"11:00", cls:"drive", action:"🚗 前往恒隆广场", note:"约20分钟车程"},
    {time:"11:30", cls:"key", action:"恒隆广场 · 考察 + 午餐", note:"重点：高端精装、灯光、材质"},
    {time:"13:30", cls:"drive", action:"🚗 前往杭州万象城", note:"约20分钟"},
    {time:"14:00", cls:"", action:"杭州万象城 · 考察", note:"重点：设计体系、施工、中庭"},
    {time:"15:45", cls:"drive", action:"🚗 前往天目里", note:"约15分钟"},

// ═══════════════════════════════════════════════
// MAP ENGINE
// ═══════════════════════════════════════════════

function wmoIcon(code) {
  if(code<=3)return'☀️';if(code<=10)return'☁️';if(code<=20)return'🌫️';if(code<=30)return'⛈️';
  if(code<=40)return'🌧️';if(code<=50)return'🌦️';return'☁️';
}

const map = L.map('map', {zoomControl:true, attributionControl:false});
const markerIcons = {
  start:'🏠', mall:'🏬', lunch:'🍽️', art:'🎨', end:'🏠'
};
const markerColors = {
  start:'#4caf50', mall:'#1976d2', lunch:'#f57c00', art:'#7b1fa2', end:'#4caf50'
};

// 居中到杭州
map.setView([30.28, 120.17], 11);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom:19, attribution:'© OSM © CARTO'
}).addTo(map);

const markers = [];
const iconTypes = ['start','mall','lunch','mall','art','end'];

stops.forEach((s, i) => {
  const t = iconTypes[i]||'mall';
  const col = markerColors[t]||'#007aff';
  const emoji = markerIcons[t]||'📍';
  
  const wrapEl = document.createElement('div');
  wrapEl.className = `mk-wrap mk-${t}`;
  wrapEl.innerHTML = `<span style="color:#fff;font-size:13px">${emoji}</span>`;
  
  const m = L.marker([s.lat, s.lng], {
    icon: L.divIcon({
      className: '',
      html: wrapEl.outerHTML,

      iconAnchor: [16,16],
      popupAnchor: [0,-20]
    }),
    zIndexOffset: t==='start'?1000:0
  }).addTo(map);
  
  // 天气芯片

  if(w){

    L.marker([s.lat, s.lng], {
      icon: L.divIcon({className:'',html:wEl.outerHTML,iconSize:[80,36],iconAnchor:[40,-30]}),

    }).addTo(map);
  }
  
  const spotsHtml = (s.spots||[]).map(sp => `

      ${w?`<div class="iw-weather">${w.icon} ${w.desc} &nbsp;${w.hi}°/${w.lo}° · ${w.wind}${w.rain>0?` · 降水${w.rain}mm`:''}${w.note?`<br><i>${w.note}</i>`:''}</div>`:''}

    </div>`;

// 路线（OSRM 免费）
async function planAllRoutes() {
  const coords = stops.filter(s=>s.lat).map(s=>[s.lat,s.lng]);
  const str = coords.map(c=>`${c[1]},${c[0]}`).join(';');
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${str}?overview=full&geometries=geojson&steps=false`);
    const data = await res.json();
    if(data.routes?.[0]){
      L.geoJSON(data.routes[0].geometry, {
        style:{color:'#007aff',weight:4,opacity:0.7}
      }).addTo(map);
    }
  } catch {
    // fallback 折线
    L.polyline(coords, {color:'#007aff',weight:3,opacity:0.5,dashArray:'8 6'}).addTo(map);
  }
  // 自适应
  const bounds = L.latLngBounds(coords);
  map.fitBounds(bounds, {padding:[50,50],maxZoom:13});
}
planAllRoutes();

// ═══════════════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════════════

const timelineEl = document.getElementById('timeline');
const typeDots = {start:'',mall:'',lunch:'',art:'',end:''};

stops.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'tl-item';
  div.dataset.idx = i;
  div.innerHTML = `
    <div class="tl-date">${s.d}</div>
    <div class="tl-name">${s.name}</div>
    <div class="tl-time">${['09:00','09:30','11:30','14:00','16:30','18:30'][i]||''}</div>
    <div class="tl-type">${s.title}</div>`;
  div.addEventListener('click', () => {
    selectCity(i);
  });
  timelineEl.appendChild(div);
});

function selectCity(i) {
  const s = stops[i];
  map.setView([s.lat, s.lng], 13, {animate:true, duration:0.4});
  markers[i].openPopup();
  timelineEl.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('active'));
  timelineEl.querySelector(`[data-idx="${i}"]`)?.classList.add('active');
  
  if(isMobile()) setDrawer('half');
}

// MOBILE DRAWER

function setDrawer(s){timelineEl.dataset.state=s}

timelineEl.addEventListener('touchstart', (e)=>{
  const y = e.touches[0].clientY;

  // swipe up = full

// ═══════════════════════════════════════════════
// ROADBOOK PANEL
// ═══════════════════════════════════════════════

function buildRoadbook() {
  document.getElementById('rb-body').innerHTML = rbDays.map(day => {
    const stop = stops.find(s=>s.d===day.d);
    const foodSpots = stop?stop.spots.filter(s=>s.tag==='food'):[];
    const mustSpots = stop?stop.spots.filter(s=>s.tag==='must'):[];
    const tipSpots = stop?stop.spots.filter(s=>s.tag==='tip'):[];

    const entries = day.entries.map(e => `
      <div class="rb-entry ${e.cls||''}">
        <div class="rb-time">${e.time}</div>
        <div class="rb-entry-right">
          <div class="rb-action">${e.action}</div>
          ${e.note?`<div class="rb-note">${e.note}</div>`:''}
        </div>
      </div>`).join('');

    const allSpots = [...mustSpots, ...tipSpots, ...foodSpots];
    const spotsHtml = allSpots.length ? `
      <div class="rb-spots">
        ${allSpots.map(sp => `
          <div class="rb-spot-item">
            ${sp.tag==='food'?'🍽️':sp.tag==='must'?'⭐':sp.tag==='tip'?'💡':'📍'}
            <b>${sp.name}</b>
            <div class="rb-note">${sp.desc}</div>
          </div>`).join('')}
      </div>` : '';

    return `
      <div class="rb-day">
        <div class="rb-day-head">
          <span class="rb-day-date">${day.d}</span>
          <span class="rb-day-city">${day.city}</span>
          <span class="rb-day-km">${day.km}</span>
        </div>
        ${day.weather?`<div class="rb-day-weather">${day.weather.icon} ${day.weather.desc} ${day.weather.hi}°/${day.weather.lo}°</div>`:''}
        <div class="rb-entries">${entries}</div>
        ${spotsHtml}
      </div>`;
  }).join('');
}

// Panel controls
document.getElementById('rb-open').addEventListener('click',()=>{
  buildRoadbook();
  document.getElementById('rb-panel').classList.add('show');
  document.getElementById('rb-overlay').classList.add('show');
});
document.getElementById('rb-close').addEventListener('click',()=>{
  document.getElementById('rb-panel').classList.remove('show');
  document.getElementById('rb-overlay').classList.remove('show');
});
document.getElementById('rb-overlay').addEventListener('click',()=>{
  document.getElementById('rb-panel').classList.remove('show');
  document.getElementById('rb-overlay').classList.remove('show');
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杭州商场考察 · 室内设计 · 2026.5.8</title>
<meta name="description" content="晶悦府→城北万象城→恒隆广场→杭州万象城→天目里">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--white:#fff;--bd:#e8e8ed;--text:#1d1d1f;--text2:#86868b;--text3:#aeaeb2;--accent:#007aff;--bg:#f5f5f7}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
#app{display:grid;grid-template-columns:148px 1fr;height:100vh;overflow:hidden}
#timeline{width:148px;overflow-y:auto;background:var(--white);border-right:1px solid var(--bd);padding:60px 0 20px}
.tl-item{padding:10px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .2s}
.tl-item:hover,.tl-item.active{background:var(--bg);border-left-color:var(--accent)}
.tl-item .tl-date{font-size:11px;color:var(--text3);font-weight:600}
.tl-item .tl-name{font-size:13px;font-weight:600;margin:2px 0;color:var(--text)}
.tl-item .tl-time{font-size:11px;color:var(--text2)}
.tl-item .tl-type{font-size:10px;color:var(--text3);margin-top:2px}
#map-wrap{position:relative;overflow:hidden}
#map{height:100vh;width:100%}
.leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important}
.leaflet-popup-content{margin:12px 14px!important;font-size:13px!important;line-height:1.5!important;max-width:280px}
.iw{font-size:13px;line-height:1.5}
.iw-date{font-size:11px;color:#aeaeb2;font-weight:600}
.iw-title{font-size:17px;font-weight:700;margin:2px 0}
.iw-brief{font-size:13px;color:#86868b;margin-bottom:6px;white-space:pre-line}
.iw-weather{background:#f0f7ff;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:6px;line-height:1.5}
.iw-spot{display:flex;gap:8px;padding:5px 0;border-top:1px solid #e8e8ed}
.iw-spot:first-of-type{border-top:none;padding-top:0}
.iw-spot-icon{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.iw-spot-body{flex:1}
.iw-spot-name{font-weight:600;font-size:13px}
.iw-spot-desc{font-size:11px;color:#86868b;margin-top:1px}
.iw-spot-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;margin-right:4px;font-weight:600}
.iw-spot-tag.food{background:rgba(255,59,48,.08);color:#ff3b30}
.iw-spot-tag.tip{background:rgba(0,122,255,.08);color:#007aff}
.iw-spot-tag.must{background:rgba(52,199,89,.08);color:#34c759}
#rb-btn{position:fixed;top:16px;right:16px;z-index:200}
.rb-trigger{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:980px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:0 1px 8px rgba(0,0,0,.12);cursor:pointer;border:none}
#rb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
#rb-overlay.show{opacity:1;pointer-events:auto}
#rb-panel{position:fixed;top:0;left:0;bottom:0;width:360px;max-width:85vw;background:var(--white);z-index:301;transform:translateX(-100%);transition:transform .35s cubic-bezier(.22,1,.36,1);overflow-y:auto;box-shadow:2px 0 20px rgba(0,0,0,.12)}
#rb-panel.show{transform:translateX(0)}
#rb-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e8e8ed;position:sticky;top:0;background:var(--white)}
#rb-header span{font-size:17px;font-weight:700}
#rb-close{width:30px;height:30px;border-radius:50%;border:none;background:#f5f5f7;font-size:16px;cursor:pointer}
#rb-body{padding:16px 20px 40px}
.rb-day{margin-bottom:24px}
.rb-day-head2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rb-day-date{font-size:11px;font-weight:600;color:#aeaeb2}
.rb-day-city{font-size:16px;font-weight:700}
.rb-day-km{font-size:12px;color:#86868b}
.rb-day-weather{font-size:12px;color:#86868b;margin:4px 0 8px}
.rb-entry{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #e8e8ed}
.rb-time{font-size:11px;font-weight:600;color:var(--accent)}
.rb-action{font-size:13px;font-weight:500}
.rb-note{font-size:11px;color:#86868b;margin-top:1px}
.rb-entry.drive .rb-time{color:#aeaeb2}
.rb-entry.key .rb-time{color:#34c759}
@media(max-width:767px){
  #app{grid-template-columns:1fr}
  #timeline{position:fixed;left:0;right:0;bottom:0;width:100%;height:80vh;z-index:500;border-radius:18px 18px 0 0;border-right:none;box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:24px 0 20px;transform:translateY(calc(80vh - 64px));transition:transform .38s cubic-bezier(.32,0,.15,1)}
  #timeline[data-state="half"]{transform:translateY(calc(80vh - 50vh))}
}
.mk-wrap{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div id="app">
  <div id="timeline"></div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="rb-btn"><button class="rb-trigger" id="rb-open">📖 文字路书</button></div>
  </div>
</div>
<div id="rb-overlay"></div>
<div id="rb-panel">
  <div id="rb-header"><span>📖 文字路书</span><button id="rb-close">✕</button></div>
  <div id="rb-body"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
try{
const stops=[
  {d:"MAY 8",name:"晶悦府",lat:30.3620,lng:120.1790,title:"出发",type:"start",brief:"城北出发，建议打车或自驾",spots:[{tag:"tip",name:"建议",desc:"检查车况、带卷尺"}]},
  {d:"MAY 8",name:"城北万象城",lat:30.3483,lng:120.1025,title:"区域型商业精装",type:"star",brief:"华润城北新作，2023年开业，约15万㎡",spots:[{tag:"must",name:"中庭动线",desc:"垂直交通与公共空间组织"},{tag:"must",name:"材料搭配",desc:"石材/金属/玻璃应用"},{tag:"must",name:"门头统装",desc:"店铺门头标准化设计"},{tag:"tip",name:"卫生间",desc:"精装标准与母婴室"},{tag:"tip",name:"导视系统",desc:"标识设计信息层级"}]},
  {d:"MAY 8",name:"恒隆广场·杭州",lat:30.2715,lng:120.1593,title:"高端商业设计+午餐",type:"star",brief:"恒隆旗舰，武林商圈核心",spots:[{tag:"must",name:"奢侈品标准",desc:"高端商业室内设计细节"},{tag:"must",name:"灯光氛围",desc:"灯光设计营造空间感"},{tag:"must",name:"材质细节",desc:"天花/地面材质与衔接"},{tag:"tip",name:"动线布局",desc:"扶梯电梯垂直组织"},{tag:"food",name:"午餐",desc:"恒隆内或武林商圈"}]},
  {d:"MAY 8",name:"杭州万象城",lat:30.2538,lng:120.2105,title:"大型商业室内体系",type:"star",brief:"钱江新城标杆，约27万㎡",spots:[{tag:"must",name:"设计体系",desc:"大型商业室内系统性"},{tag:"must",name:"施工工艺",desc:"材料选型与施工细节"},{tag:"must",name:"中庭采光",desc:"自然光与空间感"},{tag:"tip",name:"材质过渡",desc:"公共区与商业区衔接"}]},
  {d:"MAY 8",name:"天目里",lat:30.2705,lng:120.0968,title:"清水混凝土·复合空间",type:"star",brief:"皮亚诺设计，江南布衣总部",spots:[{tag:"must",name:"清水混凝土",desc:"施工工艺与质感"},{tag:"must",name:"复合空间",desc:"办公/商业/文化组织"},{tag:"tip",name:"下沉庭院",desc:"庭院与屋顶景观"},{tag:"tip",name:"建筑对话",desc:"商铺与建筑空间关系"}]},
  {d:"MAY 8",name:"返回晶悦府",lat:30.3620,lng:120.1790,title:"返回",type:"end",brief:"城西→城北，约30-40分钟",spots:[{tag:"tip",name:"晚餐",desc:"天目里解决再回"}]}
];
const w={"MAY 8":{icon:"☁️",desc:"阴有微雨",hi:22,lo:14,wind:"东南风3级"}};
const map=L.map('map',{zoomControl:true,attributionControl:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
const coords=stops.map(s=>[s.lat,s.lng]);
map.fitBounds(L.latLngBounds(coords),{padding:[50,50],maxZoom:13});

const markers=[];const times=['09:00','09:30','11:30','14:00','16:30','18:30'];
const colors={start:'#4caf50',mall:'#1976d2',lunch:'#f57c00',art:'#7b1fa2',end:'#4caf50'};
const emojis={start:'🏠',mall:'🏬',lunch:'🍽️',art:'🎨',end:'🏠'};
const types=['start','mall','lunch','mall','art','end'];

stops.forEach((s,i)=>{
  const t=types[i],c=colors[t],e=emojis[t];
  const marker=L.marker([s.lat,s.lng],{
    icon:L.divIcon({
      className:'',
      html:`<div class="mk-wrap" style="background:${c}"><span style="color:#fff;font-size:13px">${e}</span></div>`,
      iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-20]
    })
  }).addTo(map);
  const spotsHtml=s.spots.map(sp=>`<div style="display:flex;gap:8px;padding:5px 0;border-top:1px solid #e8e8ed"><div style="width:20px">${sp.tag==='food'?'🍽️':sp.tag==='tip'?'💡':'⭐'}</div><div style="flex:1"><div style="font-weight:600;font-size:13px"><span style="display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;margin-right:4px;font-weight:600;background:${sp.tag==='food'?'rgba(255,59,48,.08)':sp.tag==='tip'?'rgba(0,122,255,.08)':'rgba(52,199,89,.08)'};color:${sp.tag==='food'?'#ff3b30':sp.tag==='tip'?'#007aff':'#34c759'}">${sp.tag}</span>${sp.name}</div><div style="font-size:11px;color:#86868b;margin-top:1px">${sp.desc}</div></div></div>`).join('');
  const ww=w[s.d];
  marker.bindPopup(
    `<div style="font-size:13px;line-height:1.5">
      <div style="font-size:11px;color:#aeaeb2;font-weight:600">${s.d}</div>
      <div style="font-size:17px;font-weight:700;margin:2px 0">${s.title}</div>
      ${ww?`<div style="background:#f0f7ff;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:6px">${ww.icon} ${ww.desc} ${ww.hi}°/${ww.lo}° · ${ww.wind}</div>`:''}
      <div style="font-size:13px;color:#86868b;margin-bottom:6px">${s.brief}</div>
      ${spotsHtml}
    </div>`,{maxWidth:300});
  markers.push(marker);
});

// 路线折线
L.polyline(coords,{color:'#007aff',weight:4,opacity:0.6}).addTo(map);

// 时间轴
const tl=document.getElementById('timeline');
stops.forEach((s,i)=>{
  const d=document.createElement('div');d.className='tl-item';d.dataset.idx=i;
  d.innerHTML=`<div class="tl-date">${s.d}</div><div class="tl-name">${s.name}</div><div class="tl-time">${times[i]||''}</div><div class="tl-type">${s.title}</div>`;
  d.onclick=()=>{
    map.setView([s.lat,s.lng],13,{animate:true,duration:.4});
    markers[i].openPopup();
    document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('active'));
    d.classList.add('active');
    if(window.innerWidth<=767)document.getElementById('timeline').dataset.state='half';
  };
  tl.appendChild(d);
});

// 路书
document.getElementById('rb-open').onclick=()=>{
  document.getElementById('rb-body').innerHTML=[{
    d:"MAY 8",city:"晶悦府→4个商场→返回",km:"全程约50km",weather:w["MAY 8"],
    entries:[
      {time:"09:00",cls:"key",action:"🏠 晶悦府出发"},
      {time:"09:30",cls:"",action:"城北万象城·考察",note:"动线/材料/门头"},
      {time:"11:00",cls:"drive",action:"🚗 前往恒隆广场",note:"约20分钟"},
      {time:"11:30",cls:"key",action:"恒隆广场·考察+午餐",note:"精装/灯光/材质"},
      {time:"13:30",cls:"drive",action:"🚗 去杭州万象城",note:"约20分钟"},
      {time:"14:00",cls:"",action:"杭州万象城·考察",note:"设计体系/施工/中庭"},
      {time:"15:45",cls:"drive",action:"🚗 前往天目里",note:"约15分钟"},
      {time:"16:30",cls:"key",action:"天目里·考察",note:"清水混凝土/复合空间"},
      {time:"18:00",cls:"",action:"晚餐(天目里)"},
      {time:"18:30",cls:"key",action:"🏠 返回晶悦府"}
    ]
  }].map(day=>{
    const en=day.entries.map(e=>`<div class="rb-entry ${e.cls||''}"><div class="rb-time">${e.time}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${e.action}</div>${e.note?`<div style="font-size:11px;color:#86868b">${e.note}</div>`:''}</div></div>`).join('');
    return `<div class="rb-day"><div class="rb-day-head2"><span class="rb-day-date">${day.d}</span><span class="rb-day-city">${day.city}</span><span class="rb-day-km">${day.km}</span></div><div class="rb-day-weather">${day.weather.icon} ${day.weather.desc} ${day.weather.hi}°/${day.weather.lo}°</div><div style="display:flex;flex-direction:column">${en}</div></div>`;
  }).join('');
  document.getElementById('rb-panel').classList.add('show');
  document.getElementById('rb-overlay').classList.add('show');
};
document.getElementById('rb-close').onclick=()=>{closeRB()};
document.getElementById('rb-overlay').onclick=()=>{closeRB()};
function closeRB(){
  document.getElementById('rb-panel').classList.remove('show');
  document.getElementById('rb-overlay').classList.remove('show');
}
}catch(e){document.body.innerHTML='<h2>加载出错: '+e.message+'</h2>'}
</script>
</body>
</html>

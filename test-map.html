<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
<title>地图测试</title>
<style>
  * { margin: 0; padding: 0; }
  #map { width: 100%; height: 100vh; background: #eee; }
</style>
</head>
<body>
<div id="map">加载中...</div>

<!-- 旧版 v1.4 API，不需要 securityJsCode -->
<script src="https://webapi.amap.com/maps?v=1.4.15&key=45cbf43f4675e9b9377fa955a6b1e996"></script>
<script>
document.getElementById('map').innerHTML = 'AMap: ' + (typeof AMap);
try {
  var map = new AMap.Map('map', {
    center: [120.15, 30.28],
    zoom: 12
  });
  document.getElementById('map').innerHTML = '';
} catch(e) {
  document.getElementById('map').innerHTML = 'Error: ' + e.message;
}
</script>
</body>
</html>

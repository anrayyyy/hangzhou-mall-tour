<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
<title>地图测试</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #333; }
  #map { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="map">地图加载中...</div>

<script src="https://webapi.amap.com/maps?v=2.0&key=45cbf43f4675e9b9377fa955a6b1e996&securityJsCode=830b90a26c3b039ba69daccced906ba1"></script>
<script>
console.log('AMap loaded:', typeof AMap);
try {
  var map = new AMap.Map('map', {
    center: [120.15, 30.28],
    zoom: 12
  });
  console.log('Map created');
  document.getElementById('map').innerHTML = '';
} catch(e) {
  console.error('Error:', e);
  document.getElementById('map').innerHTML = 'Error: ' + e.message;
}
</script>
</body>
</html>
